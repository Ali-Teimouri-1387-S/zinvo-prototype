        <div class="acard"><div class="acard-h">${ic('sms', 18)} پیامک به مدیر</div><div class="acard-b" style="display:flex;flex-direction:column;gap:12px">
          <div class="af"><label>شماره مدیر (برای «زینوو اقدام کند»)</label><input class="ainp ltr" style="text-align:left" data-as="managerPhone" value="${esc(st.managerPhone)}"></div>
          <div class="af"><label>متن پیامک</label><textarea class="ainp" style="height:110px;padding:8px 10px" data-as="smsTemplate">${esc(st.smsTemplate)}</textarea><span class="hl">متغیرها: <span class="ltr">{company} {facility} {phone} {code}</span></span></div>
          <div class="prev-box" style="white-space:pre-wrap;font-size:12.5px" id="sms-pv">${esc(pv)}</div>
        </div></div>
        <div class="acard"><div class="acard-h">${ic('hourglass', 18)} انقضای خودکار</div><div class="acard-b small">هر شب یه کار زمان‌بندی‌شده (Celery beat) تسهیلاتی که تاریخ انقضاشون گذشته و «انقضای خودکار» دارن رو از سایت برمی‌داره و ${fa(st.expiryWarnDays)} روز قبلش تو داشبورد هشدار می‌ده. الان ${fa(S.facilities.filter(f => facStatus(f) === 'expired').length)} تسهیلات منقضی شده‌ان.</div></div>
      </div>
    </div>`;
}

/* ---------- رویدادهای ادمین ---------- */
const ADM_ACT = {
  'a-side'(){ ADM.side = !ADM.side; document.querySelector('.adm')?.classList.toggle('side-open', ADM.side); },
  'a-legacy'(){ toast('این بخش همون پنل فعلیه و تو نمونه اولیه تغییری نکرده'); },
  'a-ftab'(el){ ADM.ftab = el.dataset.t; render(); },
  'a-rtab'(el){ ADM.rtab = el.dataset.t; render(); },
  'a-open-f'(el, e){ if (e.target.closest('button,a')) return; go('/admin/f/' + el.dataset.id); },
  'a-preview'(el, e){ e.stopPropagation(); const id = el.dataset.id; if (ADM.fe && ADM.feId === id && ADM.dirty) { toast('اول تغییرات رو ذخیره کن'); return; } U.adminPreview = id; U.detTab = 'overview'; go('/f/' + id); },
  'a-dup'(el, e){
    e.stopPropagation();
    const src = ADM.feId === el.dataset.id && ADM.fe ? ADM.fe : facById(el.dataset.id);
    const n = clone(src); n.id = 'f' + Date.now().toString(36).slice(-4); n.title = src.title + ' (کپی)'; n.status = 'draft'; n.views = 0; n.selfClicks = 0; n.created = Date.now();
    S.facilities.push(n); save(); ADM.fe = null; go('/admin/f/' + n.id); toast('یه کپی پیش‌نویس ساخته شد');
  },
  'a-extend'(el){ const f = facById(el.dataset.id); f.expires = Math.max(Date.now(), f.expires) + 90 * 864e5; save(); render(); toast('۹۰ روز تمدید شد'); },
  'a-fchip'(el){ const k = el.dataset.k, v = el.dataset.v, a = ADM.fe[k]; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); el.classList.toggle('on'); markDirty(); },
  'a-radd'(){ ADM.fe.rules.push({q:'employees', op:'gte', v:5, kind:'req', hint:''}); ADM.dirty = true; rerenderFE(); },
  'a-rdel'(el){ ADM.fe.rules.splice(Number(el.dataset.i), 1); ADM.dirty = true; rerenderFE(); },
  'a-rchip'(el){
    const r = ADM.fe.rules[Number(el.dataset.i)], v = el.dataset.v;
    const set = [].concat(r.v ?? []); const i = set.indexOf(v);
    const cleared = staleHint(r);
    if (i >= 0) set.splice(i, 1); else set.push(v);
    r.v = set; el.classList.toggle('on'); refreshPreview(); markDirty();
    const h = el.closest('tr').querySelector('[data-rf="hint"]'); if (h) { h.placeholder = autoHint(r, S.questions); if (cleared) h.value = ''; }
  },
  'a-fsave'(el){
    const f = ADM.fe;
    if (!f.title.trim()) return toast('عنوان تسهیلات رو بنویس');
    if (!f.max || f.min > f.max) return toast('سقف و حداقل مبلغ رو درست وارد کن');
    const i = S.facilities.findIndex(x => x.id === f.id);
    if (i >= 0) S.facilities[i] = clone(f); else S.facilities.push(clone(f));
    save(); ADM.dirty = false; toast('ذخیره شد و همین الان تو نتایج سایت اعمال می‌شه');
    if (el.dataset.stay) { ADM.feId = f.id; if (location.hash !== '#/admin/f/' + f.id) location.hash = '/admin/f/' + f.id; else rerenderFE(); }
    else { ADM.fe = null; go('/admin/facilities'); }
  },
  'a-fdel'(){
    const f = ADM.fe; const n = reqCount(f.id);
    if (n) return toast(`${fa(n)} درخواست به این تسهیلات وصله؛ به‌جای حذف، از حالت انتشار درش بیار`);
    if (!confirm(`«${f.title}» حذف بشه؟`)) return;
    S.facilities = S.facilities.filter(x => x.id !== f.id); ADM.fe = null; save(); go('/admin/facilities'); toast('حذف شد');
  },
  'a-qedit'(el){ openQDrawer(el.dataset.id); },
  'a-qnew'(el){ openQDrawer(null, el.dataset.s); },
  'a-dclose'(){ closeDrawer(); },
  'a-oadd'(){ const q = ADM.dr.q; q.options.push({v:'opt_' + Date.now().toString(36), l:''}); redrawDrawer(); setTimeout(() => { const ins = document.querySelectorAll('[data-dopt]'); ins[ins.length - 1]?.focus(); }, 20); },
  'a-odel'(el){ ADM.dr.q.options.splice(Number(el.dataset.i), 1); redrawDrawer(); },
  'a-oup'(el){ const o = ADM.dr.q.options, i = Number(el.dataset.i); [o[i - 1], o[i]] = [o[i], o[i - 1]]; redrawDrawer(); },
  'a-qsave'(){
    const {q, isNew} = ADM.dr;
    if (!q.label.trim()) return toast('متن سؤال رو بنویس');
    if (CHOICE.includes(q.type)) { q.options = (q.options || []).filter(o => o.l.trim()); if (!q.options.length) return toast('حداقل یه گزینه لازمه'); }
    else delete q.options;
    if (!q.short) q.short = q.label;
    if (isNew) { const last = S.questions.map((x, i) => x.sec === q.sec ? i : -1).filter(i => i >= 0).pop(); S.questions.splice(last + 1, 0, q); }
    else S.questions[S.questions.findIndex(x => x.id === q.id)] = q;
    save(); closeDrawer(); render(); toast('ذخیره شد؛ فرم سایت به‌روز شد');
  },
  'a-qdel'(){ const q = ADM.dr.q; if (!confirm(`سؤال «${q.label}» حذف بشه؟`)) return; S.questions = S.questions.filter(x => x.id !== q.id); save(); closeDrawer(); render(); toast('حذف شد'); },
  'a-req'(el){ openReq(el.dataset.id); },
  'a-rsave'(){ saveReq(); },
  'a-sub'(el){ openSub(el.dataset.id); },
  'a-export-s'(el){ exportSubs(el.dataset.id); },
  'a-export-r'(){ exportReqs(); },
  'a-export-f'(){ exportFacs(); },
  'a-ssave'(){
    const st = ADM.st;
    if (!/^09\d{9}$/.test(st.managerPhone)) return toast('شماره مدیر باید ۱۱ رقم و با ۰۹ شروع بشه');
    S.settings = clone(st); ADM.st = null; save(); render(); toast('تنظیمات ذخیره شد');
  },
};

function onAdminInput(el){
  if (el.dataset.ad) { ADM[el.dataset.ad] = el.value; const pos = el.selectionStart; render(); const n = document.querySelector(`[data-ad="${el.dataset.ad}"]`); if (n && n.tagName === 'INPUT') { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (el.dataset.af && ADM.fe && el.type !== 'checkbox' && el.type !== 'date' && el.tagName !== 'SELECT') {
    const k = el.dataset.af, f = ADM.fe;
    if (el.hasAttribute('data-money')) { const n = parseNum(el.value); f[k] = n === '' ? 0 : n; el.value = n === '' ? '' : sep(n); const h = document.querySelector(`[data-hh="${k}"]`); if (h) h.textContent = human(f[k]); }
    else if (el.hasAttribute('data-num')) { const n = parseNum(el.value); f[k] = n === '' ? 0 : n; el.value = n === '' ? '' : fa(n); }
    else if (el.hasAttribute('data-lines')) f[k] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (el.hasAttribute('data-steps')) f[k] = el.value.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const [t, d] = s.split('|'); return {t:(t || '').trim(), d:(d || '').trim()}; });
    else f[k] = el.value;
    if (!ADM.dirty) { ADM.dirty = true; const h = document.querySelector('.adm-h .sp'); if (h) h.insertAdjacentHTML('afterend', `<span class="small" style="color:#B45309">${ic('alert', 14)} تغییرات ذخیره نشده</span>`); }
    return;
  }
  if (el.dataset.r !== undefined && ADM.fe && el.tagName === 'INPUT') {
    const r = ADM.fe.rules[Number(el.dataset.r)], k = el.dataset.rf;
    if (k === 'hint') { r.hint = el.value; ADM.dirty = true; return refreshPreview(); }
    const q = qById(S.questions, r.q); const n = parseNum(el.value);
    const cleared = staleHint(r);
    r[k] = n; el.value = n === '' ? '' : q.type === 'money' ? sep(n) : fa(n);
    const hh = v => q.type === 'money' && isNum(v) ? human(v) : isNum(v) ? fa(v) + (q.type === 'percent' ? '٪' : ' ' + (q.unit || '')) : '';
    const h = document.querySelector(`[data-rh="${el.dataset.r}"]`); if (h) h.textContent = r.op === 'between' ? `${hh(r.v)} تا ${hh(r.v2)}` : hh(r.v);
    const hint = el.closest('tr').querySelector('[data-rf="hint"]'); if (hint) { hint.placeholder = autoHint(r, S.questions); if (cleared) hint.value = ''; }
    ADM.dirty = true; refreshPreview(); return;
  }
  if (el.dataset.dq && ADM.dr && el.tagName !== 'SELECT' && el.type !== 'checkbox') { ADM.dr.q[el.dataset.dq] = el.value; return; }
  if (el.dataset.dopt !== undefined && ADM.dr) { const o = ADM.dr.q.options[Number(el.dataset.dopt)]; o.l = el.value; return; }
  if (el.dataset.dr && ADM.dr && el.tagName === 'TEXTAREA') { ADM.dr.internal = el.value; return; }
  if (el.dataset.as && ADM.st && el.type !== 'checkbox') {
    const k = el.dataset.as;
    if (el.hasAttribute('data-num')) { const n = parseNum(el.value); ADM.st[k] = n === '' ? 0 : n; el.value = n === '' ? '' : fa(n); }
    else ADM.st[k] = k === 'managerPhone' ? toEn(el.value).replace(/\D/g, '').slice(0, 11) : el.value;
    if (k === 'managerPhone') el.value = ADM.st[k];
    if (k === 'smsTemplate') { const pv = document.getElementById('sms-pv'); if (pv) pv.textContent = el.value.replace('{company}', 'فناوران داده آریا').replace('{facility}', 'تسهیلات سرمایه در گردش').replace('{phone}', '09121234567').replace('{code}', 'ZN-42011'); }
  }
}
function onAdminChange(el){
  if (el.dataset.ad === 'prof') { ADM.prof = el.value; return rerenderFE(); }
  if (el.dataset.ad) { ADM[el.dataset.ad] = el.value; return render(); }
  if (el.dataset.af && ADM.fe) {
    const k = el.dataset.af, f = ADM.fe;
    if (k === 'status') f.status = el.checked ? 'published' : 'draft';
    else if (k === 'autoExpire') f.autoExpire = el.checked;
    else if (k === 'expires') { const t = new Date(el.value + 'T23:59:00').getTime(); if (!isNaN(t)) f.expires = t; }
    else if (el.tagName === 'SELECT') f[k] = el.value;
    else return;
    ADM.dirty = true; return rerenderFE();
  }
  if (el.dataset.r !== undefined && ADM.fe && el.tagName === 'SELECT') {
    const r = ADM.fe.rules[Number(el.dataset.r)], k = el.dataset.rf;
    if (k === 'q') {
      const q = qById(S.questions, el.value); staleHint(r); r.q = el.value; r.op = opsFor(q.type)[0]; r.v2 = undefined;
      r.v = NUMERIC.includes(q.type) ? 0 : q.type === 'yesno' ? 'yes' : r.op === 'eq' ? q.options[0].v : [q.options[0].v];
    } else if (k === 'op') {
      const q = qById(S.questions, r.q); const prev = r.op; staleHint(r); r.op = el.value;
      if (CHOICE.includes(q.type) && q.type !== 'yesno') { if (r.op === 'eq') r.v = [].concat(r.v)[0] || q.options[0].v; else if (prev === 'eq') r.v = [r.v]; }
      if (r.op === 'between' && !isNum(r.v2)) r.v2 = Number(r.v) || 0;
    } else { if (k === 'v') staleHint(r); r[k] = el.value; }
    ADM.dirty = true; return rerenderFE();
  }
  if (el.dataset.dq && ADM.dr) {
    const q = ADM.dr.q, k = el.dataset.dq;
    if (k === 'req') q.req = el.checked;
    else if (k === 'sec') q.sec = Number(el.value);
    else if (k === 'type') { q.type = el.value; if (CHOICE.includes(q.type)) { if (!q.options || !q.options.length) q.options = q.type === 'yesno' ? clone(yesno) : [{v:'opt1', l:'گزینه ۱'}]; } }
    else if (k === 'cq') { if (!el.value) delete q.cond; else { const p = qById(S.questions, el.value); q.cond = {q:p.id, op:p.type === 'multi' ? 'has' : 'eq', v:p.options[0].v}; } }
    else if (k === 'cop') q.cond.op = el.value;
    else if (k === 'cv') q.cond.v = el.value;
    return redrawDrawer();
  }
  if (el.dataset.dr && ADM.dr) { const k = el.dataset.dr; if (k === 'notify') ADM.dr.notify = el.checked; else if (el.tagName === 'SELECT') ADM.dr[k] = el.value; return; }
  if (el.dataset.as && ADM.st && el.type === 'checkbox') { ADM.st[el.dataset.as] = el.checked; return; }
}

boot();
